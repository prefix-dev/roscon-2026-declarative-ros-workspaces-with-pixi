# ============================================================================
#
# Zensical configuration for the ROSCon 2026 workshop site.
#
# Run `pixi run docs` to preview, `pixi run build-docs` to build.
#
# ============================================================================

[project]
site_name = "Declarative ROS workspaces with Pixi"
site_url = "https://prefix-dev.github.io/roscon-2026-declarative-ros-workspaces-with-pixi/"
site_description = "ROSCon 2026 workshop: build reproducible, multi-platform ROS 2 workspaces with Pixi and RoboStack"
site_author = "Prefix.dev GmbH"

copyright = """
Copyright &copy; 2026 Prefix.dev GmbH &mdash;
<a href="https://github.com/prefix-dev/roscon-2026-declarative-ros-workspaces-with-pixi">source on GitHub</a>
"""

extra_css = ["assets/extra.css"]

nav = [
  { "Welcome" = "index.md" },
  { "Before you start" = "setup.md" },
  { "Slides" = "slides/" },
  { "Explainers" = [
    { "Why reproducibility matters" = "explainers/philosophy.md" },
    { "Pixi in 30 minutes" = "explainers/pixi-introduction.md" },
    { "Packages, virtual packages & CUDA" = "explainers/packaging-and-cuda.md" },
    { "Collaboration, CI/CD & Docker" = "explainers/collaboration.md" },
  ] },
  { "Exercises" = [
    { "How the exercises work" = "exercises/index.md" },
    { "1 &mdash; Your first ROS 2 workspace" = "exercises/01-ros-workspace.md" },
    { "2 &mdash; Build a ROS package with Pixi" = "exercises/02-ros-package.md" },
    { "3 &mdash; Ready for your team" = "exercises/03-collaboration.md" },
  ] },
  { "Reference" = [
    { "Command cheat sheet" = "reference/cheatsheet.md" },
    { "Troubleshooting" = "reference/troubleshooting.md" },
    { "Migrating from rosdep & colcon" = "reference/migration.md" },
  ] },
  { "Elsewhere" = [
    { "Pixi documentation" = "https://pixi.prefix.dev" },
    { "RoboStack" = "https://robostack.github.io" },
    { "conda-forge" = "https://conda-forge.org" },
    { "prefix.dev" = "https://prefix.dev" },
  ] },
]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]
favicon = "assets/prefix-logo.svg"
logo = "assets/prefix-logo.svg"
language = "en"

features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

# Follow the system preference by default, but let the reader override it.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# ----------------------------------------------------------------------------
# Repository & social
# ----------------------------------------------------------------------------
[project.repo]
url = "https://github.com/prefix-dev/roscon-2026-declarative-ros-workspaces-with-pixi"
name = "prefix-dev/roscon-2026-…-with-pixi"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/prefix-dev/pixi"
name = "Pixi on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/kKV8ZxyzY4"
name = "Ask us anything on Discord"

# ----------------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.tilde]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
