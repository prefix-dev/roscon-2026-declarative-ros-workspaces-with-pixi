# ============================================================================
#
# Zensical configuration for the ROSCon 2026 workshop site.
#
# Run `pixi run docs` to preview, `pixi run build-docs` to build.
#
# ============================================================================

[project]
site_name = "Declarative ROS workspaces with Pixi"
site_url = "https://prefix-dev.github.io/roscon-2026-declarative-ros-workspaces-with-pixi/"
site_description = "ROSCon 2026 workshop: build reproducible, multi-platform ROS 2 workspaces with Pixi and RoboStack"
site_author = "Prefix.dev GmbH"

# The header repository widget points at Pixi rather than at this workshop, so
# the star and fork counts it fetches are Pixi's and a click goes somewhere
# worth starring. The workshop repo is linked from the footer and the welcome
# page instead.
#
# These have to be flat keys on [project]: Zensical unwraps [project] into its
# config and reads repo_url/repo_name. A [project.repo] sub-table is accepted
# by the TOML parser and then silently ignored, which renders an empty widget.
repo_url = "https://github.com/prefix-dev/pixi"
repo_name = "prefix-dev/pixi"

# repo_url would otherwise derive an "edit this page" URI pointing into the
# Pixi repository, where these pages do not exist.
edit_uri = ""

copyright = """
Copyright &copy; 2026 Prefix.dev GmbH.
<a href="https://github.com/prefix-dev/roscon-2026-declarative-ros-workspaces-with-pixi">source on GitHub</a>
"""

extra_css = ["assets/extra.css"]

nav = [
  { "Welcome" = "index.md" },
  { "Before you start" = "setup.md" },
  { "Slides" = "slides/" },
  { "Explainers" = [
    { "Philosophy" = "explainers/philosophy.md" },
    { "Pixi in 30 minutes" = "explainers/pixi-introduction.md" },
    { "CUDA" = "explainers/cuda.md" },
    { "Collaboration, CI/CD & Docker" = "explainers/collaboration.md" },
  ] },
  { "Exercises" = [
    { "How the exercises work" = "exercises/intro.md" },
    { "1. Your first ROS 2 workspace" = "exercises/01-ros-workspace.md" },
    { "2. Build ROS packages with Pixi" = "exercises/02-ros-package.md" },
    { "3. Ready for your team" = "exercises/03-collaboration.md" },
  ] },
  { "Reference" = [
    { "Command cheat sheet" = "reference/cheatsheet.md" },
    { "Troubleshooting" = "reference/troubleshooting.md" },
    { "Cleaning up" = "reference/cleaning.md" },
  ] },
  { "Elsewhere" = [
    { "Pixi documentation" = "https://pixi.prefix.dev" },
    { "RoboStack" = "https://robostack.github.io" },
    { "conda-forge" = "https://conda-forge.org" },
    { "prefix.dev" = "https://prefix.dev" },
  ] },
]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]
favicon = "assets/prefix-logo.svg"
logo = "assets/prefix-logo.svg"
language = "en"

features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"

# Follow the system preference by default, but let the reader override it.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# ----------------------------------------------------------------------------
# Social
#
# The repository widget itself is configured with repo_url on [project] above.
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/prefix-dev/pixi"
name = "Pixi on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/kKV8ZxyzY4"
name = "Ask us anything on Discord"

# ----------------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.tilde]

# Include tested source straight from the repo (e.g. the solution pixi.toml),
# so code shown in the docs cannot drift from what CI actually solves.
# check_paths turns a missing or moved include into a build error.
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
