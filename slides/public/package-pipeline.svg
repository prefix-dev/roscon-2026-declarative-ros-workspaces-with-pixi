<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 355" role="img" aria-labelledby="pipeline-title pipeline-description">
  <title id="pipeline-title">From open-source projects to conda-forge and RoboStack packages</title>
  <desc id="pipeline-description">Open-source projects are built by conda-forge and published to the conda-forge channel. Those packages provide compilers, tools and libraries for RoboStack builds. RoboStack also takes ROS release sources discovered through ROS Index and rosdistro, then publishes the built packages to RoboStack channels.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#001838" />
    </marker>
    <marker id="dependency-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5773ff" />
    </marker>
  </defs>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #001838; }
    .heading { font-size: 21px; font-weight: 600; }
    .detail { font-size: 16px; }
    .label { font-size: 15px; }
    .source { fill: #f8f6f2; stroke: #a3abb5; }
    .build { fill: #fff3c4; stroke: #b99a25; }
    .channel { fill: #e9edff; stroke: #5773ff; }
    .flow { fill: none; stroke: #001838; stroke-width: 2; marker-end: url(#arrow); }
    .dependency { fill: none; stroke: #5773ff; stroke-width: 2.5; marker-end: url(#dependency-arrow); }
  </style>

  <path class="flow" d="M265 65H323" />
  <path class="flow" d="M575 65H633" />
  <path class="flow" d="M265 290H323" />
  <path class="flow" d="M575 290H633" />
  <text class="label" x="294" y="49" text-anchor="middle">build</text>
  <text class="label" x="604" y="49" text-anchor="middle">publish</text>
  <text class="label" x="294" y="274" text-anchor="middle">build</text>
  <text class="label" x="604" y="274" text-anchor="middle">publish</text>

  <path class="dependency" d="M760 110V155H450V243" />
  <text x="605" y="185" text-anchor="middle" style="font-size: 19px; font-weight: 600; fill: #5773ff;">Build environment</text>
  <text class="detail" x="605" y="209" text-anchor="middle">compilers, tools + libraries</text>

  <rect class="source" x="15" y="20" width="250" height="90" rx="10" />
  <text class="heading" x="140" y="56" text-anchor="middle">Open-source projects</text>
  <text class="detail" x="140" y="83" text-anchor="middle">Python · OpenCV · CMake</text>

  <rect class="build" x="325" y="20" width="250" height="90" rx="10" />
  <text class="heading" x="450" y="56" text-anchor="middle">conda-forge builds</text>
  <text class="detail" x="450" y="83" text-anchor="middle">source + conda recipes</text>

  <rect class="channel" x="635" y="20" width="250" height="90" rx="10" />
  <text class="heading" x="760" y="56" text-anchor="middle">conda-forge channel</text>
  <text class="detail" x="760" y="83" text-anchor="middle">pre-built conda packages</text>

  <rect class="source" x="15" y="245" width="250" height="90" rx="10" />
  <text class="heading" x="140" y="281" text-anchor="middle">ROS package sources</text>
  <text class="detail" x="140" y="308" text-anchor="middle">via ROS Index / rosdistro</text>

  <rect class="build" x="325" y="245" width="250" height="90" rx="10" />
  <text class="heading" x="450" y="281" text-anchor="middle">RoboStack builds</text>
  <text class="detail" x="450" y="308" text-anchor="middle">ROS source + conda recipes</text>

  <rect class="channel" x="635" y="245" width="250" height="90" rx="10" />
  <text class="heading" x="760" y="281" text-anchor="middle">RoboStack channels</text>
  <text class="detail" x="760" y="308" text-anchor="middle">robostack-jazzy, -kilted, …</text>
</svg>
