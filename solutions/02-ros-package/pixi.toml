# Solution to Exercise 2 — Build ROS packages with Pixi.
#
# The same C++ package Exercise 1 built with colcon, plus a Python one, now both
# built and installed by Pixi straight from their package.xml:
#
#     pixi run sim            # in one terminal
#     pixi run dance          # in another — C++
#     pixi run choreograph    # ...or Python
#
# Compare with Exercise 1: no `colcon build`, no `source install/setup.bash`, no
# build/ install/ log/ directories. Edit a source file and `pixi run` again —
# Pixi rebuilds what changed.
#
# NOTE: the edit-then-rerun loop above does not currently rebuild on a source-only
# change. See PIXI_IMPROVEMENTS.md finding 1; `pixi run check-edit-run-loop` at
# the repository root watches for the fix.

[workspace]
name = "turtle-dancer-workspace"
description = "A mixed C++/Python ROS 2 workspace built by Pixi"
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]
version = "0.1.0"
preview = ["pixi-build"]

[dependencies]
# Our own packages, built from source. The names are the package.xml names with
# the ROS distro prefix that RoboStack uses.
ros-jazzy-turtle-dancer = { path = "src/turtle_dancer" }
ros-jazzy-turtle-choreographer = { path = "src/turtle_choreographer" }
# What we need to run them.
ros-jazzy-ros2run = ">=0.32"
ros-jazzy-ros2topic = ">=0.32"
ros-jazzy-turtlesim = ">=1.8"

[tasks.sim]
cmd = "ros2 run turtlesim turtlesim_node"
description = "Start the turtlesim window"

[tasks.dance]
cmd = "ros2 run turtle_dancer dance"
description = "Run the C++ node — Pixi builds it first if the source changed"

[tasks.choreograph]
cmd = "ros2 run turtle_choreographer choreograph"
description = "Run the Python node"

[tasks.test]
cmd = "python -c \"import turtle_choreographer.choreograph as c; assert c.main; print('packages: ok')\""
description = "Prove both packages were built and installed — what CI runs"

[tasks.executables]
cmd = "ros2 pkg executables turtle_dancer"
description = "Show that the ROS tooling sees our node, exactly as after a colcon build"
