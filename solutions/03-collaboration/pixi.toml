# Solution to Exercise 3: Ready for your team.
#
#
#   * every platform the team uses, all solved from whichever one you are on
#   * named targets for hardware nobody is sitting at: a GPU box and a Jetson
#   * a lockfile check and an executable smoke test that CI can run
#   * a Dockerfile that ships the exact environment from the lockfile
#
#     pixi run lock-check       # what CI runs on every pull request
#     pixi run robot-list       # what would land on the Jetson, solved from here
#     pixi run gpu-run          # run the node on a real GPU (see docs: Brev)
#     pixi run docker-build     # build the runtime image

[workspace]
name = "ros-demo-team"
description = "A multi-platform ROS 2 workspace ready for a team, CI and a robot"
channels = ["https://prefix.dev/robostack-lyrical", "conda-forge"]
version = "0.1.0"

# Every machine the team develops on, plus the hardware we deploy to.
#
# The named entries describe machines we do not have in front of us: the solver
# is told what they report, so we can resolve for them from a laptop. This is
# the whole trick: solving is cheap and portable, installing is the expensive
# part you only do where you need it.
platforms = [
  "linux-64",
  "linux-aarch64",
  { platform = "osx-arm64", macos = "14.0" },
  { platform = "osx-64", macos = "14.0" },
  "win-64",
  { name = "workstation-gpu", platform = "linux-64", cuda = "12.0" },
  { name = "jetson", platform = "linux-aarch64", cuda = "12.6" },
]

[dependencies]
ros-lyrical-demo-nodes-cpp = ">=0.37.9,<0.38"
ros-lyrical-ros2run = ">=0.40"
ros-lyrical-ros2topic = ">=0.40"

[tasks.talker]
cmd = "ros2 run demo_nodes_cpp talker"
description = "Publish messages with the pre-built ROS demo node"

[tasks.listener]
cmd = "ros2 run demo_nodes_cpp listener"
description = "Receive the demo talker's messages"

[tasks.lock-check]
cmd = "pixi lock --check"
description = "Fail if the lockfile is out of date: the gate CI enforces"

[tasks.test]
cmd = "ros2 pkg executables demo_nodes_cpp"
description = "Check that ROS can find the installed demo package and list its executables"

[tasks.robot-list]
cmd = "pixi list -e robot --platform jetson"
description = "Show what would be installed on the Jetson, without owning one"

[tasks.docker-build]
cmd = "docker build -t ros-demo-team:latest ."
description = "Build the runtime image"

# ---------------------------------------------------------------------------
# The robot: aarch64 with CUDA. Solved on your laptop, installed on the Jetson.
# ---------------------------------------------------------------------------
[feature.robot]
platforms = ["jetson"]

[feature.robot.dependencies]
cuda-version = ">=12.6"

# ---------------------------------------------------------------------------
# A GPU workstation: a desktop with an NVIDIA card, or the cloud instance the
# workshop hands out. Only Linux can have CUDA, which is why this feature is
# restricted to the GPU platform rather than declared workspace-wide.
# ---------------------------------------------------------------------------
[feature.gpu]
platforms = ["workstation-gpu"]

[feature.gpu.dependencies]
cuda-version = ">=12.0"

[feature.gpu.tasks.gpu-run]
cmd = "ros2 run demo_nodes_cpp talker"
description = "Run the node on a machine that actually has a GPU"

[feature.gpu.tasks.gpu-check]
cmd = "python -c \"import os; print('CUDA visible:', os.path.exists('/proc/driver/nvidia'))\""
description = "Confirm the GPU is really there"

[environments]
# What you get by default: the pre-built demo nodes.
default = { features = [] }
# What goes on the robot: no GUI, CUDA assumed.
robot = { features = ["robot"] }
# A desktop or cloud instance with an NVIDIA card.
gpu = { features = ["gpu"] }
