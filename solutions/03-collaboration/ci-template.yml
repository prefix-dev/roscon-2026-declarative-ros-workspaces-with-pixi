# A minimal GitHub Actions workflow for a Pixi workspace.
#
# Not active in this repository. GitHub only runs workflows from
# `.github/workflows/`. Copy this file to `.github/workflows/ci.yml` in your
# own repository.
#
# A grown-up version of this, with a platform matrix and a lockfile gate, runs
# against all the solutions in `.github/workflows/ci.yml` at the root of this
# repository.

# --8<-- [start:workflow]
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          # Install exactly what the lockfile says, and fail if it is stale.
          locked: true
      - run: pixi run test
# --8<-- [end:workflow]
