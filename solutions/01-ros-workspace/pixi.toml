# Solution to Exercise 1 — Your first ROS 2 workspace.
#
# A complete ROS 2 environment with no ROS installed on the machine:
#
#     pixi run sim       # in one terminal
#     pixi run teleop    # in another
#     pixi run dance     # or let a node drive

[workspace]
name = "turtle-workspace"
description = "A ROS 2 Jazzy workspace with turtlesim, managed entirely by Pixi"
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64", "win-64"]
version = "0.1.0"

[dependencies]
# The ROS 2 command line tooling and the core libraries.
ros-jazzy-ros-base = ">=0.11"
# The simulator we drive around.
ros-jazzy-turtlesim = ">=1.8"
# For writing nodes in Python.
ros-jazzy-rclpy = ">=7.1"
ros-jazzy-geometry-msgs = ">=4.8"

[tasks.sim]
cmd = "ros2 run turtlesim turtlesim_node"
description = "Start the turtlesim window"

[tasks.teleop]
cmd = "ros2 run turtlesim turtle_teleop_key"
description = "Drive the turtle with the arrow keys"

[tasks.dance]
cmd = "python nodes/dance.py"
description = "Let a node drive the turtle in a circle"

[tasks.topics]
cmd = "ros2 topic list"
description = "List the ROS topics — proof that ROS works without sourcing anything"

[tasks.test]
cmd = "python -c \"import rclpy; from geometry_msgs.msg import Twist; print('ros: ok')\""
description = "Prove the ROS Python stack is importable — this is what CI runs"
