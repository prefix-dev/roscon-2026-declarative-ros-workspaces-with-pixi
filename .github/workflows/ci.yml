# Keeps the exercise solutions honest.
#
# This workflow is also teaching material: Exercise 3 asks participants to read
# it. Keep it simple enough to explain in two minutes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Package versions move underneath us. A weekly run tells us before a
  # participant finds out.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The cheap gate: is every lockfile up to date with its manifest?
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          run-install: false
      - name: Check the workshop lockfile
        run: pixi lock --check
      - name: Check the solution lockfiles
        run: |
          for solution in solutions/*/; do
            echo "::group::$solution"
            pixi lock --check --manifest-path "$solution/pixi.toml"
            echo "::endgroup::"
          done

  # The real check: every solution installs and runs, on every OS we promise.
  solutions:
    needs: lockfiles
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        solution:
          - 01-ros-workspace
          - 02-ros-package
          - 03-collaboration
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Windows caps paths at 260 characters, and the runner spends ~100 of
      # them writing the repository name twice. Source builds nest deep enough
      # to cross the limit, so park the environments somewhere short.
      - name: Keep pixi's paths short on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.pixi" | Out-Null
          Add-Content "$env:USERPROFILE\.pixi\config.toml" "detached-environments = 'C:\pix'"

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          manifest-path: solutions/${{ matrix.solution }}/pixi.toml
          locked: true

      - name: Run the smoke test
        run: pixi run --manifest-path solutions/${{ matrix.solution }}/pixi.toml test

  # Exercise 1 claims one workspace can hold two ROS distributions. Prove it.
  # Linux only. This installs two full ROS stacks, and the claim is not
  # platform-specific.
  two-distros:
    needs: lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          manifest-path: solutions/01-ros-workspace/pixi.toml
          environments: default kilted
          locked: true
      - name: Jazzy in the default environment
        run: pixi run --manifest-path solutions/01-ros-workspace/pixi.toml test
      - name: Kilted in the same workspace
        run: pixi run --manifest-path solutions/01-ros-workspace/pixi.toml -e kilted test

  # Exercise 1 asks participants to build a package with colcon inside the Pixi
  # environment, including on Windows. Prove that it works on every OS.
  colcon-on-every-os:
    needs: lockfiles
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Same MAX_PATH story as in `solutions`: here it is cl.exe that cannot
      # open a rosidl header 267 characters deep inside .pixi/envs.
      - name: Keep pixi's paths short on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.pixi" | Out-Null
          Add-Content "$env:USERPROFILE\.pixi\config.toml" "detached-environments = 'C:\pix'"
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          manifest-path: solutions/01-ros-workspace/pixi.toml
          locked: true
      - name: colcon build
        # console_direct+ because MSVC prints its errors to stdout, which
        # colcon's default event handlers do not echo for failed packages.
        run: pixi run --manifest-path solutions/01-ros-workspace/pixi.toml build --event-handlers console_direct+
      # `ros2 pkg executables` only finds our node once the overlay is
      # sourced, which the activation scripts do. Listing it instead of
      # running it keeps CI from spinning a node forever.
      - name: The node is findable because activation sources the overlay
        run: pixi run --manifest-path solutions/01-ros-workspace/pixi.toml ros2 pkg executables turtle_dancer

  # Make sure the docs and the slides still build.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          locked: true
      - run: pixi run build-docs
      - run: pixi run build-slides

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: lint
          locked: true
      - run: pixi run lint
