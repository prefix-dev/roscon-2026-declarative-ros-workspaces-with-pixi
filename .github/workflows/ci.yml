# Keeps the exercise solutions honest.
#
# This workflow is also teaching material: Exercise 3 asks participants to read
# it. Keep it simple enough to explain in two minutes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Package versions move underneath us. A weekly run tells us before a
  # participant finds out.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The cheap gate: is every lockfile up to date with its manifest?
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - name: Check the workshop lockfile
        run: pixi lock --check
      - name: Check the solution lockfiles
        run: |
          for solution in solutions/*/; do
            echo "::group::$solution"
            pixi lock --check --manifest-path "$solution/pixi.toml"
            echo "::endgroup::"
          done

  # The real check: every solution installs and runs, on every OS we promise.
  solutions:
    needs: lockfiles
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        solution:
          - 01-ros-workspace
          - 02-ros-package
          - 03-collaboration
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Windows caps paths at 260 characters, and the runner spends ~100 of
      # them writing the repository name twice. Source builds nest deep enough
      # to cross the limit, so park the environments somewhere short.
      - name: Keep pixi's paths short on Windows
        if: runner.os == 'Windows' && matrix.solution != '03-collaboration'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.pixi" | Out-Null
          Add-Content "$env:USERPROFILE\.pixi\config.toml" "detached-environments = 'C:\pix'"

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: solutions/${{ matrix.solution }}/pixi.toml
          locked: true

      - name: Run the smoke test
        run: pixi run --manifest-path solutions/${{ matrix.solution }}/pixi.toml test

  # Build both overlays and switch back, catching shared paths and chained underlays.
  # Linux only here; the colcon job below also checks the default overlay on macOS/Windows.
  two-distros:
    needs: lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: solutions/01-ros-workspace/pixi.toml
          environments: default kilted
          locked: true
      - name: Build and check Lyrical
        run: |
          pixi run --manifest-path solutions/01-ros-workspace/pixi.toml -e default build
          pixi run --manifest-path solutions/01-ros-workspace/pixi.toml -e default test-overlay
      - name: Kilted before its first overlay exists
        run: pixi run --manifest-path solutions/01-ros-workspace/pixi.toml -e kilted test
      - name: Build and check Kilted
        run: |
          pixi run --manifest-path solutions/01-ros-workspace/pixi.toml -e kilted build
          pixi run --manifest-path solutions/01-ros-workspace/pixi.toml -e kilted test-overlay
      - name: Switch back to Lyrical
        run: |
          pixi run --manifest-path solutions/01-ros-workspace/pixi.toml -e default build
          pixi run --manifest-path solutions/01-ros-workspace/pixi.toml -e default test-overlay

  # Exercise 1 asks participants to build a package with colcon inside the Pixi
  # environment, including on Windows. Prove that it works on every OS.
  colcon-on-every-os:
    needs: lockfiles
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SOLUTION_DIR: solutions/01-ros-workspace
    steps:
      - uses: actions/checkout@v7
      # Detached environments shorten dependency paths, not colcon's build tree.
      # MSBuild's FileTracker also needs a short workspace for its .tlog files.
      - name: Keep environment and build paths short on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $solution = Join-Path $env:RUNNER_TEMP "ros"
          Copy-Item -Recurse $env:SOLUTION_DIR $solution
          Add-Content $env:GITHUB_ENV "SOLUTION_DIR=$solution"
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.pixi" | Out-Null
          Add-Content "$env:USERPROFILE\.pixi\config.toml" "detached-environments = 'C:\pix'"
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: ${{ env.SOLUTION_DIR }}/pixi.toml
          locked: true
      - name: colcon build
        # console_direct+ because MSVC prints its errors to stdout, which
        # colcon's default event handlers do not echo for failed packages.
        run: pixi run --manifest-path "${{ env.SOLUTION_DIR }}/pixi.toml" build --event-handlers console_direct+
      - name: Both ROS executables and imports belong to this overlay
        run: pixi run --manifest-path "${{ env.SOLUTION_DIR }}/pixi.toml" test-overlay

  # Make sure the docs and the slides still build.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          locked: true
      - run: pixi run build-docs
      - run: pixi run build-slides

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: lint
          locked: true
      - run: pixi run lint
