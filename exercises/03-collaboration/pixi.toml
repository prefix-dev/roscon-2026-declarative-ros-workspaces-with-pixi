# Exercise 3: starting point.
#
# Start with pre-built ROS demo nodes. This exercise covers CI and deployment,
# without compiling the packages from Exercise 2.
#
# Your job:
#   1. Put the workspace on GitHub and add locked CI.
#   2. Complete the Dockerfile and run the image.
#   3. Pack the environment, unpack it and run the nodes without Pixi.
#
# Instructions: https://prefix-dev.github.io/roscon-2026-declarative-ros-workspaces-with-pixi/exercises/03-collaboration/

[workspace]
name = "ros-demo-team"
description = "ROS 2 demo nodes for CI and deployment"
channels = ["https://prefix.dev/robostack-lyrical", "conda-forge"]
platforms = [
  "linux-64",
  "linux-aarch64",
  { platform = "osx-arm64", macos = "14.0" },
  { platform = "osx-64", macos = "14.0" },
  "win-64",
]

[dependencies]
ros-lyrical-demo-nodes-cpp = ">=0.37.9,<0.38"
ros-lyrical-ros2run = ">=0.40"
ros-lyrical-ros2topic = ">=0.40"
[tasks.talker]
cmd = "ros2 run demo_nodes_cpp talker"
description = "Publish messages with the pre-built ROS demo node"

[tasks.listener]
cmd = "ros2 run demo_nodes_cpp listener"
description = "Receive the demo talker's messages"

[tasks.test]
cmd = "ros2 pkg executables demo_nodes_cpp"
description = "Check that ROS can find the installed demo package and list its executables"
