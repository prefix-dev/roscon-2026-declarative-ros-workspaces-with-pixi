# Exercise 3 — starting point.
#
# This is where Exercise 2 left off: Pixi builds both packages, and it all works
# on your machine. Now make it work for everyone else's, and for the robot.
#
# Your job:
#   1. Add every platform your team uses.
#   2. Add named targets for hardware you do not have in front of you — a GPU
#      workstation and a Jetson — and solve for them from here.
#   3. Turn on CI.
#   4. Run the node on a machine that really has a GPU.
#
# Instructions: https://prefix-dev.github.io/roscon-2026-declarative-ros-workspaces-with-pixi/exercises/03-collaboration/

[workspace]
name = "turtle-dancer-team"
description = "A ROS 2 workspace that works on exactly one machine"
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
platforms = ["osx-arm64"]
version = "0.1.0"
preview = ["pixi-build"]

[dependencies]
ros-jazzy-turtle-dancer = { path = "src/turtle_dancer" }
ros-jazzy-turtle-choreographer = { path = "src/turtle_choreographer" }
ros-jazzy-ros2run = ">=0.32"
ros-jazzy-ros2topic = ">=0.32"
ros-jazzy-turtlesim = ">=1.8"

[tasks.sim]
cmd = "ros2 run turtlesim turtlesim_node"
description = "Start the turtlesim window"

[tasks.dance]
cmd = "ros2 run turtle_dancer dance"
description = "Run the C++ node"

[tasks.choreograph]
cmd = "ros2 run turtle_choreographer choreograph"
description = "Run the Python node"

[tasks.test]
cmd = "python -c \"import turtle_choreographer.choreograph as c; assert c.main; print('packages: ok')\""
description = "Prove both packages were built and installed"
